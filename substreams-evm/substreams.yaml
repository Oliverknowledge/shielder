specVersion: v0.1.0
package:
  name: shield_evm_behavioral_memory
  version: v0.1.0
  url: https://github.com/Oliverknowledge/shiedler
  description: ShieldVault.sol (HyperEVM / any EVM) — typed event decoding composed on the ethereum-common foundational block index, USDC-return detection, capital-flow classification across the vault boundary, and per-vault behavioural totals. One pipeline shape reused across chains (see ../substreams for Solana).

imports:
  ethereum_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3

network: hyper-evm

protobuf:
  files:
    - shield/evm/v1/shield_evm.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/shield_evm_behavioral_memory.wasm

# Set these to the deployed vault contract and the network's native USDC.
# The foundational `index_events` block index lets both maps skip every
# block that has no log from either address.
params:
  map_shield_events: "evt_addr:0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0"
  map_vault_flows: "evt_addr:0x9fe46736679d2d9a65f0992f2272de9f3c7fa6e0 || evt_addr:0x2b3370ee501b4a559b57d449569354196457d8ab"

modules:
  # ---- Stage 1: typed decoding, filtered by the foundational block index ----
  - name: map_shield_events
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    blockFilter:
      module: ethereum_common:index_events
      query:
        params: true
    output:
      type: proto:shield.evm.v1.ShieldEvents

  # ---- Stage 2: registry state (which addresses are trading wallets) ----
  - name: store_vault_registry
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_shield_events

  # ---- Stage 3: capital flows across the vault boundary ----
  - name: map_vault_flows
    kind: map
    initialBlock: 0
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_shield_events
      - store: store_vault_registry
    blockFilter:
      module: ethereum_common:index_events
      query:
        params: true
    output:
      type: proto:shield.evm.v1.VaultFlows

  # ---- Stage 4: running totals and profiles ----
  - name: store_flow_totals
    kind: store
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_vault_flows

  - name: map_behavioral_profiles
    kind: map
    inputs:
      - store: store_flow_totals
        mode: deltas
    output:
      type: proto:shield.evm.v1.BehavioralProfiles
