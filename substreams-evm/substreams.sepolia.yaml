specVersion: v0.1.0
package:
  name: shield_evm_behavioral_memory_sepolia
  version: v0.1.0
  url: https://github.com/Oliverknowledge/shielder
  description: Sepolia twin of the HyperEVM package (same modules, same ABI) so the pipeline streams real rows from a Graph provider. ShieldVault.sol (HyperEVM / any EVM) — typed event decoding composed on the ethereum-common foundational block index, USDC-return detection, capital-flow classification across the vault boundary, and per-vault behavioural totals. One pipeline shape reused across chains (see ../substreams for Solana).

imports:
  ethereum_common: https://spkg.io/v1/packages/ethereum-common/v0.3.3

network: sepolia

protobuf:
  files:
    - shield/evm/v1/shield_evm.proto
  importPaths:
    - ./proto

# HyperEVM mainnet was at ~45.22M when this package was cut. Modules that start
# at block 0 make every stateful run backprocess the entire chain before the
# first output — `substreams run map_vault_flows` fails outright with
# "needs to process 45,220,118 blocks". The vault is deployed after this height,
# so nothing is missed by starting here; move it to the exact deploy block once
# that is known and the run gets cheaper still.
binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/shield_evm_behavioral_memory.wasm

# The deployed vault contract and the network's native USDC.
#
# These MUST list the same addresses as each module's `blockFilter.query`
# below. The block index decides which blocks are delivered; `params` decides
# which addresses the WASM then decodes. Point them at different contracts and
# the pipeline runs cleanly over the right blocks and emits nothing at all —
# which is exactly what happened when this file was repointed at HyperEVM and
# only the filter was updated. `substreams-config.test.ts` now pins the two
# together so the halves cannot drift apart again.
params:
  map_shield_events: "evt_addr:0xf1ef03ea258ef652939bac0250d1cde9b5ef4f6a"
  map_vault_flows: "evt_addr:0xf1ef03ea258ef652939bac0250d1cde9b5ef4f6a || evt_addr:0xb0cbbeb2783e3965036db1740911be45ad389837"

modules:
  # ---- Stage 1: typed decoding, filtered by the foundational block index ----
  - name: map_shield_events
    kind: map
    # Ethereum Sepolia: the Sepolia twin's deploy block (same bytecode, ROUTE_EVM only).
    initialBlock: &initialBlock 11654048
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
    blockFilter:
      module: ethereum_common:index_events
      query:
        string: "evt_addr:0xf1ef03ea258ef652939bac0250d1cde9b5ef4f6a"
    output:
      type: proto:shield.evm.v1.ShieldEvents

  # ---- Stage 2: registry state (which addresses are trading wallets) ----
  - name: store_vault_registry
    kind: store
    initialBlock: *initialBlock
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_shield_events

  # ---- Stage 3: capital flows across the vault boundary ----
  - name: map_vault_flows
    kind: map
    initialBlock: *initialBlock
    inputs:
      - params: string
      - source: sf.ethereum.type.v2.Block
      - map: map_shield_events
      - store: store_vault_registry
    blockFilter:
      module: ethereum_common:index_events
      query:
        string: "evt_addr:0xf1ef03ea258ef652939bac0250d1cde9b5ef4f6a || evt_addr:0xb0cbbeb2783e3965036db1740911be45ad389837"
    output:
      type: proto:shield.evm.v1.VaultFlows

  # ---- Stage 4: running totals and profiles ----
  - name: store_flow_totals
    kind: store
    initialBlock: *initialBlock
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_vault_flows

  - name: map_behavioral_profiles
    kind: map
    initialBlock: *initialBlock
    inputs:
      - store: store_flow_totals
        mode: deltas
    output:
      type: proto:shield.evm.v1.BehavioralProfiles
