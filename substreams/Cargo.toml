[workspace]

[package]
name = "shield-behavioral-memory"
version = "0.2.0"
edition = "2021"
description = "Substreams for the Shield vault program on Solana: typed instruction + event decoding, capital-flow classification, and per-vault behavioural totals"

[lib]
crate-type = ["cdylib"]

[dependencies]
substreams = "0.7"
substreams-solana = "0.15"
prost = "0.13"
prost-types = "0.13"
base64 = "0.22"
hex = "0.4"

[build-dependencies]
prost-build = "0.13"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
