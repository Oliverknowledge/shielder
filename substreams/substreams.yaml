specVersion: v0.1.0
package:
  name: shield_behavioral_memory
  version: v0.2.0
  url: https://github.com/Oliverknowledge/shiedler
  description: Shield vault program (Solana) — typed instruction/event decoding, capital-flow classification across the vault boundary, and per-vault behavioural totals.

network: solana-devnet

protobuf:
  files:
    - shield/v1/shield.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/shield_behavioral_memory.wasm

modules:
  # ---- Stage 1: typed decoding -------------------------------------------
  - name: map_shield_instructions
    kind: map
    initialBlock: 391843999 # devnet first streamable slot; set to the program's deploy slot for production
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:shield.v1.ShieldInstructions

  - name: map_shield_events
    kind: map
    initialBlock: 391843999
    inputs:
      - source: sf.solana.type.v1.Block
    output:
      type: proto:shield.v1.ShieldEvents

  # ---- Stage 2: registry state -------------------------------------------
  - name: store_vault_registry
    kind: store
    updatePolicy: set
    valueType: string
    inputs:
      - map: map_shield_instructions
      - map: map_shield_events

  - name: store_vault_wallets
    kind: store
    updatePolicy: append
    valueType: string
    inputs:
      - map: map_shield_events

  # ---- Stage 3: capital flows across the vault boundary ------------------
  - name: map_vault_flows
    kind: map
    initialBlock: 391843999
    inputs:
      - source: sf.solana.type.v1.Block
      - map: map_shield_events
      - store: store_vault_registry
        mode: get
    output:
      type: proto:shield.v1.VaultFlows

  # ---- Stage 4: running totals -------------------------------------------
  - name: store_flow_totals
    kind: store
    updatePolicy: add
    valueType: int64
    inputs:
      - map: map_vault_flows

  # ---- Stage 5: per-vault profile snapshots ------------------------------
  - name: map_behavioral_profiles
    kind: map
    initialBlock: 391843999
    inputs:
      - source: sf.solana.type.v1.Block
      - store: store_flow_totals
        mode: deltas
      - store: store_flow_totals
        mode: get
      - store: store_vault_wallets
        mode: get
    output:
      type: proto:shield.v1.BehavioralProfiles
