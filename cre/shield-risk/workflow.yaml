# ==========================================================================
# CRE WORKFLOW SETTINGS — shield-risk (confidential loss-rule evaluation)
# ==========================================================================
staging-settings:
  user-workflow:
    workflow-name: "shield-risk-staging"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.staging.json"
    secrets-path: "../secrets.yaml"

production-settings:
  user-workflow:
    workflow-name: "shield-risk-production"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.production.json"
    secrets-path: "../secrets.yaml"

evm-settings:
  user-workflow:
    workflow-name: "shield-risk-evm"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.evm.json"
    secrets-path: "../secrets.yaml"

# Identical to evm-settings with delivery off, so the workflow can be run end to
# end — secret read, evaluation, signature — without broadcasting a verdict to a
# live vault. Use this one to reproduce; use evm-settings to actually relay.
evm-dry-settings:
  user-workflow:
    workflow-name: "shield-risk-evm-dry"
  workflow-artifacts:
    workflow-path: "./main.ts"
    config-path: "./config.evm-dry.json"
    secrets-path: "../secrets.yaml"
