# ==========================================================================
# CRE SECRETS — Shield
# ==========================================================================
# Maps the secret id the enclave requests with `runtime.getSecret({ id })`
# to the environment variable holding its value (simulation: .env; deployed:
# the Vault DON, released only into an attested enclave).
#
# SHIELD_VERIFIER_SEED_B64 is the base64 32-byte Ed25519 seed whose public
# key the user's vault has pinned as `risk_verifier`. It never leaves the
# enclave; only the signature it produces does. Print it from the demo key:
#   bun run scripts/print-verifier-seed.ts
secretsNames:
    SHIELD_VERIFIER_SEED_B64:
        - SHIELD_VERIFIER_SEED_B64
