# ==========================================================================
# CRE SECRETS — Shield
# ==========================================================================
# Maps the secret id the enclave requests with `runtime.getSecret({ id })`
# to the environment variable holding its value (simulation: .env; deployed:
# the Vault DON, released only into an attested enclave).
#
# SHIELD_VERIFIER_SEED_B64 is the base64 32-byte Ed25519 seed whose public
# key the user's vault has pinned as `risk_verifier`. It never leaves the
# enclave; only the signature it produces does. Print it from the demo key:
#   bun run scripts/print-verifier-seed.ts
# SHIELD_EVM_VERIFIER_KEY is the 0x-prefixed secp256k1 private key whose
# address the user's ShieldVault.sol vault has pinned as riskVerifier (EVM
# build). Same rule: it never leaves the enclave; only EIP-712 signatures do.
# LADDER_<vault>: the user's private risk-ladder thresholds (JSON; see
# client/ladder.ts). The chain holds only their salted hash. One entry per
# vault the enclave may evaluate; the value is what the user exported from the
# app's ladder builder and never goes on chain or into Shield's server.
secretsNames:
    SHIELD_VERIFIER_SEED_B64:
        - SHIELD_VERIFIER_SEED_B64
    SHIELD_EVM_VERIFIER_KEY:
        - SHIELD_EVM_VERIFIER_KEY
    LADDER_0x751d1e26d79feffe95f8a8662ab7a022780ed023:
        - LADDER_CRE_DEMO_VAULT
    LADDER_0x9872f09d96bca7f878cee9c4bdc8bcca269db006:
        - LADDER_DEMO_VAULT
    LADDER_0xf39fd6e51aad88f6f4ce6ab8827279cfffb92266:
        - LADDER_ANVIL_VAULT
    LADDER_0x2946947fe968da1dbb758d03c44255a08990310c:
        - LADDER_LADDER_VAULT
    LADDER_0xaa8cfbd03cd4e043228bcce42b5add98866f7d8b:
        - LADDER_LADDER2_VAULT
