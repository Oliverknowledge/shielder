[package]
name = "shield-vault"
version = "0.1.0"
description = "Shield: a treasury vault that gates the reload, not the trade"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "shield_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"
